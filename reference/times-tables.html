<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Times Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:   #2B1D45;
    --panel:  #3D2A5F;
    --panel2: #4B3573;
    --amber:  #FFC145;
    --mint:   #6DE0A6;
    --coral:  #FF7F6E;
    --cream:  #FFF4E2;
    --dim:    rgba(255,244,226,.55);
    --font: "Fredoka", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%;
    background: var(--deep);
    color: var(--cream);
    font-family: var(--font);
    font-weight: 500;
    overscroll-behavior: none;
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 14px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- the animal behind everything ---- */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 11vh;
    pointer-events: none;
  }
  #bg svg {
    width: min(74vw, 330px);
    height: auto;
    opacity: .24;
    transition: opacity .3s ease;
  }
  #bg svg.enter { opacity: 0; }

  /* a rare one glows while it's on screen */
  #bg.rare svg { filter: drop-shadow(0 0 20px rgba(255,193,69,.6)); }
  #bg.rare svg:not(.enter) { animation: rareglow 2.6s ease-in-out infinite; }
  @keyframes rareglow {
    0%, 100% { opacity: .26; }
    50%      { opacity: .44; }
  }

  .rarity {
    font-size: 15px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: .04em;
  }

  /* ---- score strip ---- */
  .strip {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 8px;
    font-size: 14px;
    white-space: nowrap;
    color: var(--dim);
  }
  .strip b { color: var(--cream); font-weight: 600; }
  .strip .spacer { flex: 1; }
  .chip-btn {
    font: inherit; font-size: 14px;
    color: var(--dim);
    background: none;
    border: 1.5px solid rgba(255,244,226,.25);
    border-radius: 999px;
    padding: 5px 13px;
    cursor: pointer;
  }
  .chip-btn:hover { color: var(--cream); border-color: rgba(255,244,226,.5); }

  /* ---- backpack ---- */
  .bag {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: var(--amber);
    background: var(--panel);
    border: none; border-radius: 999px;
    padding: 6px 13px 6px 10px;
    cursor: pointer;
  }
  .bag svg { width: 22px; height: 22px; display: block; }
  .bag.pop { animation: bagpop .5s ease; }
  @keyframes bagpop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.28) rotate(-6deg); }
    60%  { transform: scale(1.05) rotate(4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .bag:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  .flyer {
    position: fixed; z-index: 9; pointer-events: none; opacity: .75;
    transition: transform .55s cubic-bezier(.5,-0.12,.55,1), opacity .55s ease-in;
  }
  .flyer svg { width: 100%; height: 100%; display: block; }

  /* ---- collection ---- */
  .collection {
    background: var(--panel);
    border-radius: 20px;
    padding: 14px 14px 16px;
    max-height: 40vh;
    overflow-y: auto;
  }
  .collection .head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 12px;
  }
  .collection h2 { font-size: 16px; font-weight: 600; margin: 0; color: var(--cream); }
  .collection .count { font-size: 14px; color: var(--amber); font-weight: 600; }
  .collection .empty-note { font-size: 14px; color: var(--dim); margin: 0 0 12px; }

  .grp { font-size: 14px; font-weight: 600; color: var(--dim); margin: 16px 0 8px; }
  .grp:first-child { margin-top: 0; }
  .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .slot.elem { box-shadow: inset 0 0 0 2px var(--ec); }

  /* ---- quests ---- */
  .quests {
    background: var(--panel);
    border-radius: 20px;
    padding: 14px;
    max-height: 56vh;
    overflow-y: auto;
  }
  .quests h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: var(--cream); }
  .quests .qintro { font-size: 14px; color: var(--dim); margin: 0 0 12px; }
  #questList { display: flex; flex-direction: column; gap: 8px; }
  .qcard {
    display: flex; align-items: center; gap: 12px;
    font: inherit; color: var(--cream); text-align: left;
    background: var(--panel2);
    border: none; border-radius: 14px;
    padding: 10px 14px 10px 10px;
    cursor: pointer;
  }
  .qcard:disabled { opacity: .45; cursor: default; }
  .qcard:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .qcard > svg { width: 44px; height: 44px; flex: none; }
  .qcard .mid { flex: 1; min-width: 0; }
  .qcard .qt { display: block; font-size: 17px; font-weight: 600; }
  .qcard .qs { display: block; font-size: 13px; color: var(--dim); }
  .qcard .len { text-align: center; flex: none; line-height: 1; }
  .qcard .len b { display: block; font-size: 26px; font-weight: 700; color: var(--qc); }
  .qcard .len small { font-size: 11px; color: var(--dim); }

  .questbar {
    background: var(--panel);
    border-radius: 16px;
    padding: 10px 12px 12px;
  }
  .qb-top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin-bottom: 9px; }
  .qb-top svg { width: 22px; height: 22px; display: block; }
  .qb-count { color: var(--qc); }
  .qb-top .spacer { flex: 1; }
  .track { display: flex; gap: 3px; }
  .track i { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,244,226,.14); transition: background .2s; }
  .track i.on { background: var(--qc); }
  .track i.miss { background: var(--coral); }

  .reward {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding-top: 4px;
  }
  .reward h2 { font-size: 26px; font-weight: 700; margin: 0; color: var(--amber); }
  .reward > p { margin: 2px 0 12px; color: var(--dim); font-size: 16px; }
  .prize svg { width: min(58vw, 230px); height: auto; display: block; margin: 0 auto; }
  .prize .pn { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .claim { width: 100%; font-size: 22px; padding: 16px 0; margin-top: 14px; }
  .pickgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .pickgrid button {
    font: inherit; color: var(--cream);
    background: var(--panel2);
    border: none; border-radius: 14px;
    padding: 6px 4px 7px;
    cursor: pointer;
  }
  .pickgrid button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .pickgrid svg { width: 100%; height: auto; display: block; }
  .pickgrid .nm { font-size: 12px; }
  .pickgrid .st { font-size: 11px; font-weight: 600; color: var(--amber); }
  .pickgrid .st.new { color: var(--mint); }
  .pickgrid button.rare { background: #5A4327; box-shadow: inset 0 0 0 2px var(--amber); }
  .pickgrid button:disabled { opacity: .38; cursor: default; }
  .pickgrid .st.wait { color: var(--dim); }
  .slot {
    background: var(--panel2);
    border-radius: 14px;
    padding: 6px 4px 7px;
    text-align: center;
  }
  .slot svg { width: 100%; height: auto; display: block; }
  .slot .nm { font-size: 12px; color: var(--cream); margin-top: 1px; }
  .slot .ct { font-size: 11px; color: var(--amber); font-weight: 600; line-height: 1.2; }
  .slot.rare { background: #5A4327; box-shadow: inset 0 0 0 2px var(--amber); }
  .slot .star { font-size: 11px; color: var(--amber); line-height: 1; }
  .slot.locked { opacity: .35; }
  .slot.locked .q {
    font-size: 26px; font-weight: 700; color: var(--dim);
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
  }

  /* ---- the equation ---- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 0;
  }
  .eq {
    font-size: clamp(50px, 17vw, 78px);
    font-weight: 600;
    letter-spacing: .02em;
    line-height: 1;
    white-space: nowrap;
  }
  .eq .op { color: var(--amber); padding: 0 .12em; }

  .entry {
    font-size: clamp(46px, 15vw, 70px);
    font-weight: 700;
    line-height: 1.1;
    min-height: 1.15em;
    min-width: 2.2em;
    text-align: center;
    border-bottom: 5px solid rgba(255,244,226,.22);
    padding: 0 .25em;
    transition: border-color .15s, color .15s;
  }
  .entry.empty { color: rgba(255,244,226,.2); }
  .entry.right { color: var(--mint); border-bottom-color: var(--mint); }
  .entry.wrong { color: var(--coral); border-bottom-color: var(--coral); }

  .note { font-size: 17px; color: var(--dim); min-height: 1.3em; text-align: center; }
  .note.win { color: var(--mint); }

  /* ---- correction card ---- */
  .fix {
    background: var(--panel);
    border: 2px solid var(--coral);
    border-radius: 20px;
    padding: 18px 20px 20px;
    text-align: center;
  }
  .fix .lead { font-size: 16px; color: var(--dim); margin-bottom: 8px; }
  .fix .answer {
    font-size: clamp(36px, 12vw, 52px);
    font-weight: 700;
    line-height: 1.1;
  }
  .fix .answer .op { color: var(--amber); padding: 0 .1em; }
  .fix .answer .val { color: var(--mint); }

  /* ---- keypad ---- */
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  .key {
    font: inherit;
    font-size: 30px;
    font-weight: 600;
    color: var(--cream);
    background: var(--panel);
    border: none;
    border-radius: 16px;
    padding: 14px 0;
    cursor: pointer;
    transition: transform .06s ease, background .12s;
  }
  .key:active { transform: scale(.94); background: var(--panel2); }
  .key.util { font-size: 24px; background: var(--panel2); color: var(--dim); }
  .key.go { background: var(--amber); color: var(--deep); }
  .key.wide { grid-column: span 3; font-size: 22px; padding: 16px 0; }
  .key.span2 { grid-column: span 2; font-size: 21px; padding: 16px 0; }
  .key.span1 { font-size: 18px; padding: 16px 0; }
  .key:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }


  .hidden { display: none !important; }

  /* an open panel takes over the screen until "Done" */
  #app.panel-open .stage,
  #app.panel-open .pad,
  #app.panel-open .fix,
  #app.panel-open .reward { display: none !important; }
  #app.panel-open .quests,
  #app.panel-open .collection { flex: 1; min-height: 0; max-height: none; overflow-y: auto; }

  @media (max-width: 420px) {
    #streakWrap { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .key:active { transform: none; }
    .bag.pop { animation: none; }
    #bg.rare svg:not(.enter) { animation: none; opacity: .4; }
    * { transition: none !important; }
  }
</style>

<div id="bg" aria-hidden="true"></div>

<div id="app">
  <div class="strip">
    <span><b id="score">0</b> right</span>
    <span id="streakWrap" class="hidden">· <b id="streak">0</b> in a row</span>
    <span class="spacer"></span>
    <button class="chip-btn" id="questsBtn">Quests</button>
    <button class="bag" id="bagBtn" aria-label="Open backpack">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 7.5V6.5a4 4 0 0 1 8 0v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <rect x="3" y="7" width="18" height="14" rx="4.5" fill="currentColor"/>
        <path d="M3.6 14h16.8" stroke="var(--panel)" stroke-width="2"/>
        <rect x="9.6" y="15.4" width="4.8" height="4" rx="1.3" fill="var(--panel)"/>
      </svg>
      <span id="bagCount">0</span>
    </button>
  </div>

  <div class="questbar hidden" id="questbar">
    <div class="qb-top">
      <span id="qbIcon"></span>
      <span id="qbName"></span>
      <span class="qb-count" id="qbCount"></span>
      <span class="spacer"></span>
      <button class="chip-btn" id="qbQuit">Quit</button>
    </div>
    <div class="track" id="track"></div>
  </div>

  <div class="reward hidden" id="reward">
    <h2 id="rewardTitle"></h2>
    <p id="rewardSub"></p>
    <div id="rewardBody" style="width:100%"></div>
  </div>

  <div class="stage" id="stage">
    <div class="rarity hidden" id="rarity">★ rare animal</div>
    <div class="eq" id="eq">7 <span class="op">×</span> 8</div>
    <div class="entry empty" id="entry">?</div>
    <div class="note" id="note"></div>
  </div>

  <div class="fix hidden" id="fix">
    <div class="lead" id="fixLead">Not quite.</div>
    <div class="answer" id="fixAnswer"></div>
  </div>

  <div class="pad" id="pad"></div>

  <div class="quests hidden" id="quests">
    <h2>Quests</h2>
    <p class="qintro">Get every problem right to win. One wrong answer ends the quest.</p>
    <div id="questList"></div>
  </div>

  <div class="collection hidden" id="collection">
    <div class="head">
      <h2>Backpack</h2>
      <span class="count" id="collCount"></span>
    </div>
    <p class="empty-note hidden" id="collEmpty">Get an answer right and the animal hops in here.</p>
    <div class="slots" id="slots"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MIN = 2, MAX = 12;     // no ×1 problems: too easy
  var STORE_KEY = "times-tables-state";

  var state = {
    weak: {},            // "a x b" -> times still owed
    caught: {},          // animal name -> how many times caught
    wins: {},            // quest id -> times beaten
    rarePickDay: "",     // local date of the last rare animal taken from Pick-a-Pet
    mysteryDay: "",      // local date the Mystery Box was last opened
    score: 0,
    streak: 0
  };

  var current = null;    // {a, b, answer}
  var typed = "";
  var phase = "ask";     // ask | correcting
  var lastKey = "";
  var sinceReview = 0;
  var showing = -1;      // index of the animal currently on screen
  var quest = null;      // {def, done} while a quest is running

  var el = {};
  ["score","streak","streakWrap","eq","entry","note","fix","fixLead","fixAnswer",
   "pad","stage","bg","bagBtn","bagCount",
   "collection","collCount","collEmpty","slots","rarity",
   "questsBtn","quests","questList","questbar","qbIcon","qbName","qbCount","qbQuit","track",
   "reward","rewardTitle","rewardSub","rewardBody"].forEach(function (id) { el[id] = document.getElementById(id); });

  /* ---------- storage (best effort) ---------- */

  function save() {
    if (!window.storage) return;
    try {
      window.storage.set(STORE_KEY, JSON.stringify({
        weak: state.weak, caught: state.caught, wins: state.wins,
        rarePickDay: state.rarePickDay, mysteryDay: state.mysteryDay
      }), false);
    } catch (e) { /* practice still works without saving */ }
  }

  function load() {
    if (!window.storage) return Promise.resolve(null);
    try {
      return window.storage.get(STORE_KEY, false)
        .then(function (r) { return r ? JSON.parse(r.value) : null; })
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }

  /* ---------- animals ---------- */

          '<path d="M100 62 L134 82 L134 118 L100 138 L66 118 L66 82 Z" fill="#FF7C9C"/>' +
          '<path d="M100 22 V62 M164 60 L134 82 M164 140 L134 118 M100 178 V138 M36 140 L66 118 M36 60 L66 82" stroke="#B3123A" stroke-width="5"/>',
    golden: '<path d="M30 150 L40 60 L75 100 L100 40 L125 100 L160 60 L170 150 Z" fill="#FFCC33"/>' +
            '<rect x="30" y="140" width="140" height="26" rx="6" fill="#E8B020"/>' +
            '<g fill="#FF4F7B"><circle cx="40" cy="58" r="11"/><circle cx="100" cy="38" r="11"/><circle cx="160" cy="58" r="11"/></g>',
    diamond: '<path d="M58 56 H142 L176 94 L100 178 L24 94 Z" fill="#A8F0F5"/>' +
             '<path d="M24 94 H176 M58 56 L78 94 L100 178 L122 94 L142 56 M78 94 L100 56 L122 94" fill="none" stroke="#5CC8F0" stroke-width="5" stroke-linejoin="round"/>'
  };

  // Longer quest = harder. Diamond is the longest.
  var QUESTS = [
    { id: "mystery", name: "Mystery Box",      len: 1,  color: "#B48CFF", blurb: "1 problem, a surprise quest animal. Once a day!" },
    { id: "pick",    name: "Pick-a-Pet Quest", len: 8,  color: "#FFC145", blurb: "You pick the animal" },
    { id: "water",   name: "Water Quest",      len: 10, color: "#5FC6E8", blurb: "Win a water animal" },
    { id: "earth",   name: "Earth Quest",      len: 12, color: "#7CC46A", blurb: "Win an earth animal" },
    { id: "fire",    name: "Fire Quest",      len: 14, color: "#FF8A3D", blurb: "Win a fire animal" },
    { id: "ice",     name: "Ice Quest",        len: 18, color: "#BDE3F7", blurb: "Win an ice animal" },
    { id: "emerald", name: "Emerald Quest",    len: 19, color: "#3DD68C", blurb: "Win an emerald animal" },
    { id: "ruby",    name: "Ruby Quest",       len: 21, color: "#FF4F7B", blurb: "Win a ruby animal" },
    { id: "golden",  name: "Golden Quest",     len: 23, color: "#FFCC33", blurb: "Win a golden animal" },
    { id: "diamond", name: "Diamond Quest",    len: 25, color: "#A8F0F5", blurb: "Win a diamond animal" }
  ];

  var bag = [];

  function nextAnimal() {
    if (Math.random() < RARE_CHANCE) {
      return COMMON + Math.floor(Math.random() * (ANIMALS.length - COMMON));
    }
    if (!bag.length) {                          // reshuffle once every common one has had a turn
      bag = [];
      for (var i = 0; i < COMMON; i++) bag.push(i);
      for (var k = bag.length - 1; k > 0; k--) {
        var j = Math.floor(Math.random() * (k + 1));
        var t = bag[k]; bag[k] = bag[j]; bag[j] = t;
      }
    }
    return bag.pop();
  }

  function setBackground(inner, rare) {
    el.bg.innerHTML = '<svg class="enter" viewBox="0 0 200 200">' + inner + "</svg>";
    el.bg.classList.toggle("rare", !!rare);
    el.rarity.classList.toggle("hidden", !rare);
    var svg = el.bg.querySelector("svg");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { svg.classList.remove("enter"); });
    });
  }

  function swapAnimal() {
    if (quest) { showing = -1; return; }     // the quest emblem stays put
    showing = nextAnimal();
    setBackground(ANIMALS[showing], isRare(showing));
  }

  /* ---------- the backpack ---------- */

  function caughtCount() {
    return Object.keys(state.caught).filter(function (n) { return state.caught[n] > 0; }).length;
  }

  function renderBag() {
    el.bagCount.textContent = caughtCount() + "/" + COLLECTIBLES.length;
  }

  // Fly an animal from where it is on screen into the backpack button.
  function flyToBag(idx, src) {
    src = src || el.bg.querySelector("svg");
    if (!src) { bagPop(); return; }

    var a = src.getBoundingClientRect();
    var b = el.bagBtn.getBoundingClientRect();

    var f = document.createElement("div");
    f.className = "flyer";
    f.style.left = a.left + "px";
    f.style.top = a.top + "px";
    f.style.width = a.width + "px";
    f.style.height = a.height + "px";
    f.style.opacity = getComputedStyle(src).opacity;
    f.innerHTML = '<svg viewBox="0 0 200 200">' + COLLECTIBLES[idx].svg + "</svg>";
    document.body.appendChild(f);
    src.style.visibility = "hidden";        // it left; the copy is the one flying

    var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    var dy = (b.top + b.height / 2) - (a.top + a.height / 2);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = "translate(" + dx + "px," + dy + "px) scale(.08)";
        f.style.opacity = "0";
      });
    });

    setTimeout(function () {
      if (f.parentNode) f.parentNode.removeChild(f);
      bagPop();
    }, 560);
  }

  function bagPop() {
    el.bagBtn.classList.remove("pop");
    void el.bagBtn.offsetWidth;          // restart the animation
    el.bagBtn.classList.add("pop");
    renderBag();
  }

  function collect(idx, src) {
    if (idx < 0) return false;
    var name = COLLECTIBLES[idx].name;
    var isNew = !state.caught[name];
    state.caught[name] = (state.caught[name] || 0) + 1;
    flyToBag(idx, src);
    if (!el.collection.classList.contains("hidden")) renderCollection();
    return isNew;
  }

  function renderCollection() {
    var found = caughtCount();
    el.collCount.textContent = found + " of " + COLLECTIBLES.length + " found";
    el.collEmpty.classList.toggle("hidden", found > 0);

    el.slots.innerHTML = "";
    GROUPS.forEach(function (g) {
      var E = ELEMENTS[g.key];
      var h = document.createElement("h3");
      h.className = "grp";
      h.textContent = g.label;
      if (E) h.style.color = E.color;
      var grid = document.createElement("div");
      grid.className = "slots-grid";

      COLLECTIBLES.forEach(function (c) {
        if (c.group !== g.key) return;
        var n = state.caught[c.name] || 0;
        var rare = c.group === "rare";
        var d = document.createElement("div");
        d.className = "slot" + (n ? "" : " locked") + (rare ? " rare" : "") + (E ? " elem" : "");
        if (E) d.style.setProperty("--ec", E.color);
        var tag = rare
          ? '<div class="star">★ ' + (n > 1 ? "×" + n : "rare") + "</div>"
          : '<div class="ct">' + (n > 1 ? "×" + n : "&nbsp;") + "</div>";
        d.innerHTML = n
          ? '<svg viewBox="0 0 200 200">' + c.svg + '</svg><div class="nm">' + c.label + "</div>" + tag
          : '<div class="q">?</div><div class="nm">&nbsp;</div>' + tag;
        grid.appendChild(d);
      });

      el.slots.appendChild(h);
      el.slots.appendChild(grid);
    });
  }

  /* ---------- question picking ---------- */

  function key(a, b) { return a + "x" + b; }

  function randomFact() {
    var a = MIN + Math.floor(Math.random() * (MAX - MIN + 1));   // always all tables, 2–12
    var b = MIN + Math.floor(Math.random() * (MAX - MIN + 1));
    return { a: a, b: b };
  }

  function weakFacts() {
    return Object.keys(state.weak).filter(function (k) { return state.weak[k] > 0; });
  }

  function nextQuestion() {
    var pick = null;
    var weak = weakFacts();

    // Every few questions, bring back something he missed earlier.
    if (weak.length && sinceReview >= 3 && Math.random() < 0.55) {
      var k = weak[Math.floor(Math.random() * weak.length)];
      var parts = k.split("x");
      pick = { a: +parts[0], b: +parts[1] };
      sinceReview = 0;
    } else {
      for (var i = 0; i < 12; i++) {
        pick = randomFact();
        if (key(pick.a, pick.b) !== lastKey) break;
      }
      sinceReview++;
    }

    current = { a: pick.a, b: pick.b, answer: pick.a * pick.b };
    lastKey = key(pick.a, pick.b);
    typed = "";
    phase = "ask";
    swapAnimal();
    render();
  }

  /* ---------- rendering ---------- */

  function render() {
    el.eq.innerHTML = current.a + ' <span class="op">×</span> ' + current.b;
    el.entry.textContent = typed === "" ? "?" : typed;
    el.entry.className = "entry" + (typed === "" ? " empty" : "");
    el.score.textContent = state.score;
    el.streak.textContent = state.streak;
    el.streakWrap.classList.toggle("hidden", state.streak < 3);
    buildPad();
  }

  function buildPad() {
    el.pad.innerHTML = "";

    if (phase === "correcting") {
      if (quest) {
        var def = quest.def;
        el.pad.appendChild(makeKey("Try again", "key go span2", function () { startQuest(def); }));
        el.pad.appendChild(makeKey("Stop", "key util span1", endQuest));
      } else {
        el.pad.appendChild(makeKey("Got it", "key go wide", function () {
          resetScreen();
          nextQuestion();
        }));
      }
      return;
    }

    ["1","2","3","4","5","6","7","8","9"].forEach(function (d) {
      el.pad.appendChild(makeKey(d, "key", function () { type(d); }));
    });
    el.pad.appendChild(makeKey("⌫", "key util", erase));
    el.pad.appendChild(makeKey("0", "key", function () { type("0"); }));
    el.pad.appendChild(makeKey("✓", "key go", check));
  }

  function makeKey(label, cls, fn) {
    var b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  /* ---------- answering ---------- */

  function type(d) {
    if (phase !== "ask" || typed.length >= 3) return;
    if (typed === "" && d === "0") return;
    typed += d;
    el.entry.textContent = typed;
    el.entry.className = "entry";
    el.note.textContent = "";
    el.note.className = "note";
  }

  function erase() {
    if (phase !== "ask") return;
    typed = typed.slice(0, -1);
    el.entry.textContent = typed === "" ? "?" : typed;
    el.entry.className = "entry" + (typed === "" ? " empty" : "");
  }

  function check() {
    if (phase !== "ask" || typed === "") return;
    var k = key(current.a, current.b);

    if (+typed === current.answer) {
      state.score++;
      state.streak++;
      if (state.weak[k]) {
        state.weak[k]--;
        if (state.weak[k] <= 0) delete state.weak[k];
      }
      phase = "wait";                  // no double-tapping ✓ while the next one loads

      if (quest) {
        quest.done++;
        renderTrack();
        var left = quest.def.len - quest.done;
        el.entry.className = "entry right";
        el.note.className = "note win";
        el.note.textContent = left === 0 ? "Quest beaten!" : left === 1 ? "One more!" : left + " to go";
        save();
        setTimeout(left === 0 ? winQuest : nextQuestion, left === 0 ? 700 : 520);
        return;
      }

      var rare = isRare(showing);
      var isNew = collect(showing);
      el.entry.className = "entry right";
      el.note.textContent = rare
        ? "You caught the " + NAMES[showing].toLowerCase() + "!"
        : isNew
          ? NAMES[showing] + " jumped in your backpack!"
          : (state.streak >= 5 ? state.streak + " in a row!" : "Yes!");
      el.note.className = "note win";
      save();
      setTimeout(nextQuestion, rare ? 1100 : isNew ? 820 : 660);
    } else {
      state.streak = 0;
      state.weak[k] = 2;              // he'll see this one twice more
      el.entry.className = "entry wrong";
      phase = "correcting";
      el.fixLead.textContent = !quest ? "The answer is:"
        : quest.def.id === "mystery" ? "Not quite. The answer is:" : "Quest over. The answer is:";
      if (quest && el.track.children[quest.done]) el.track.children[quest.done].className = "miss";
      el.fixAnswer.innerHTML = current.a + ' <span class="op">×</span> ' + current.b +
                               ' = <span class="val">' + current.answer + "</span>";
      el.stage.classList.add("hidden");
      el.fix.classList.remove("hidden");
      el.streakWrap.classList.add("hidden");
      save();
      buildPad();
    }
  }

  /* ---------- quest flow ---------- */

  function resetScreen() {
    el.fix.classList.add("hidden");
    el.reward.classList.add("hidden");
    el.stage.classList.remove("hidden");
    el.pad.classList.remove("hidden");
    el.note.textContent = "";
    el.note.className = "note";
  }

  function renderQuests() {
    el.questList.innerHTML = "";
    QUESTS.forEach(function (q) {
      var sub = q.blurb;
      if (ELEMENTS[q.id]) {
        var total = 0, have = 0;
        COLLECTIBLES.forEach(function (c) {
          if (c.group === q.id) { total++; if (state.caught[c.name]) have++; }
        });
        sub += " (" + have + " of " + total + " found)";
      }
      var used = q.id === "mystery" && state.mysteryDay === today();
      if (used) sub = "Opened today. Come back tomorrow!";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qcard";
      b.disabled = used;
      b.style.setProperty("--qc", q.color);
      b.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true">' + EMBLEMS[q.id] + "</svg>" +
        '<span class="mid"><span class="qt">' + q.name + '</span><span class="qs">' + sub + "</span></span>" +
        '<span class="len"><b>' + q.len + "</b><small>" + (q.len === 1 ? "problem" : "in a row") + "</small></span>";
      b.addEventListener("click", function () { if (!b.disabled) startQuest(q); });
      el.questList.appendChild(b);
    });
  }

  function renderTrack() {
    var len = quest.def.len;
    el.qbCount.textContent = quest.done + "/" + len;
    if (el.track.children.length !== len) {
      el.track.innerHTML = "";
      for (var i = 0; i < len; i++) el.track.appendChild(document.createElement("i"));
    }
    for (var j = 0; j < len; j++) el.track.children[j].className = j < quest.done ? "on" : "";
  }

  function startQuest(def) {
    quest = { def: def, done: 0 };
    showPanel("none");
    el.questsBtn.classList.add("hidden");
    el.questbar.classList.remove("hidden");
    el.qbQuit.classList.remove("hidden");
    el.questbar.style.setProperty("--qc", def.color);
    el.qbIcon.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true">' + EMBLEMS[def.id] + "</svg>";
    el.qbName.textContent = def.name;
    renderTrack();
    setBackground(EMBLEMS[def.id], false);
    resetScreen();
    nextQuestion();
  }

  function endQuest() {
    quest = null;
    el.questbar.classList.add("hidden");
    el.questsBtn.classList.remove("hidden");
    resetScreen();
    nextQuestion();
  }

  // Random animal of the quest's type, favoring ones he doesn't have yet.
  function rollElement(key) {
    var pool = [], fresh = [];
    COLLECTIBLES.forEach(function (c, i) {
      if (c.group !== key) return;
      pool.push(i);
      if (!state.caught[c.name]) fresh.push(i);
    });
    var from = fresh.length ? fresh : pool;
    return from[Math.floor(Math.random() * from.length)];
  }

  // Local calendar date, e.g. "2026-10-14".
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function claim(idx, src) {
    if (phase !== "reward") return;
    phase = "flying";
    collect(idx, src);
    save();
    setTimeout(endQuest, 900);
  }

  function winQuest() {
    var def = quest.def;
    state.wins[def.id] = (state.wins[def.id] || 0) + 1;
    save();

    phase = "reward";
    el.qbQuit.classList.add("hidden");
    el.stage.classList.add("hidden");
    el.pad.classList.add("hidden");
    el.reward.classList.remove("hidden");
    el.rewardTitle.textContent = def.id === "mystery" ? "The Mystery Box opened!" : def.name + " beaten!";
    el.rewardBody.innerHTML = "";

    if (def.id === "mystery") {
      state.mysteryDay = today();
      save();
      var pool = [];
      COLLECTIBLES.forEach(function (c, i) { if (ELEMENTS[c.group]) pool.push(i); });
      var mi = pool[Math.floor(Math.random() * pool.length)];
      var mc = COLLECTIBLES[mi];
      el.rewardSub.textContent = state.caught[mc.name] ? "You got another one!" : "You got a new animal!";
      var mprize = document.createElement("div");
      mprize.className = "prize";
      mprize.innerHTML = '<svg viewBox="0 0 200 200">' + mc.svg + '</svg><div class="pn">' + mc.name + "</div>";
      el.rewardBody.appendChild(mprize);
      el.rewardBody.appendChild(makeKey("Put it in my backpack", "key go claim", function () {
        claim(mi, mprize.querySelector("svg"));
      }));
    } else if (def.id === "pick") {
      var rareUsed = state.rarePickDay === today();
      el.rewardSub.textContent = rareUsed
        ? "Pick an animal. You already picked a rare one today."
        : "Pick any animal. You can pick 1 rare animal a day.";
      var grid = document.createElement("div");
      grid.className = "pickgrid";
      COLLECTIBLES.forEach(function (c, i) {
        if (c.group !== "animals" && c.group !== "rare") return;
        var rare = c.group === "rare";
        var n = state.caught[c.name] || 0;
        var b = document.createElement("button");
        b.type = "button";
        if (rare) b.className = "rare";
        var st = n ? '<div class="st">have ×' + n + "</div>" : '<div class="st new">new!</div>';
        if (rare && rareUsed) { b.disabled = true; st = '<div class="st wait">tomorrow</div>'; }
        b.innerHTML = '<svg viewBox="0 0 200 200">' + c.svg + '</svg><div class="nm">' + c.label + "</div>" + st;
        b.addEventListener("click", function () {
          if (b.disabled) return;
          if (rare) state.rarePickDay = today();
          claim(i, b.querySelector("svg"));
        });
        grid.appendChild(b);
      });
      el.rewardBody.appendChild(grid);
    } else {
      var idx = rollElement(def.id);
      var c = COLLECTIBLES[idx];
      el.rewardSub.textContent = state.caught[c.name] ? "You won another one!" : "You won a new animal!";
      var prize = document.createElement("div");
      prize.className = "prize";
      prize.innerHTML = '<svg viewBox="0 0 200 200">' + c.svg + '</svg><div class="pn">' + c.name + "</div>";
      var go = makeKey("Put it in my backpack", "key go claim", function () {
        claim(idx, prize.querySelector("svg"));
      });
      el.rewardBody.appendChild(prize);
      el.rewardBody.appendChild(go);
    }
  }

  el.qbQuit.addEventListener("click", function () {
    if (phase === "reward" || phase === "flying") return;
    endQuest();
  });

  /* ---------- panels ---------- */

  function showPanel(which) {
    el.quests.classList.toggle("hidden", which !== "quests");
    el.collection.classList.toggle("hidden", which !== "bag");
    document.getElementById("app").classList.toggle("panel-open", which !== "none");
    el.questsBtn.textContent = which === "quests" ? "Done" : "Quests";
    if (which === "bag") renderCollection();
    if (which === "quests") renderQuests();
  }

  el.questsBtn.addEventListener("click", function () {
    showPanel(el.quests.classList.contains("hidden") ? "quests" : "none");
  });

  el.bagBtn.addEventListener("click", function () {
    showPanel(el.collection.classList.contains("hidden") ? "bag" : "none");
  });

  /* ---------- physical keyboard, for a laptop ---------- */

  document.addEventListener("keydown", function (e) {
    if (document.getElementById("app").classList.contains("panel-open")) return;
    if (phase === "correcting") {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.pad.firstChild.click(); }
      return;
    }
    if (phase === "reward") {
      var btn = el.rewardBody.querySelector(".claim");
      if (btn && e.key === "Enter") { e.preventDefault(); btn.click(); }
      return;
    }
    if (e.key >= "0" && e.key <= "9") type(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); erase(); }
    else if (e.key === "Enter") check();
  });

  /* ---------- start ---------- */

  renderBag();
  nextQuestion();

  load().then(function (saved) {
    if (!saved) return;
    if (saved.weak && typeof saved.weak === "object") {
      // drop any old ×1 facts left over from before
      Object.keys(saved.weak).forEach(function (k) {
        var p = k.split("x");
        if (+p[0] >= MIN && +p[1] >= MIN) state.weak[k] = saved.weak[k];
      });
    }
    if (saved.caught && typeof saved.caught === "object") state.caught = saved.caught;
    if (saved.wins && typeof saved.wins === "object") state.wins = saved.wins;
    if (typeof saved.rarePickDay === "string") state.rarePickDay = saved.rarePickDay;
    if (typeof saved.mysteryDay === "string") state.mysteryDay = saved.mysteryDay;
    renderBag();
    if (!el.collection.classList.contains("hidden")) renderCollection();
  });
})();
</script>
